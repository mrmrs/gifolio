<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>MRMRS Gifolio</title>
  <meta name="author" content="Adam Morse">
  <meta name="description" content="Gif Portfolio of mrmrs">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
  <style>
    html, body { background: #f3f3f3; color: #111; overflow: hidden; }
    body { font-family: avenir, 'avenir next', helvetica, 'helvetica neue', arial, sans-serif !important; }
    h1 { font-size: 1.5em; text-transform: uppercase; letter-spacing: 0.13em; }
    img { max-width: 720px; border-radius: 8px; box-shadow: 0 0 5px 2px rgba(0,0,0,.14); }
    svg { max-width: 100%; }

    @keyframes fadein {
      from { transform: scale(.5); opacity: 0; }
      to   { transform: scale(1); opacity: 1; }
    }
    .anim-fade-in {
      animation-name: fadein;
      animation-timing-function: ease-in;
      animation-fill-mode: forwards;
    }
    .anim-slow {
      animation-duration: 8s;
    }
    .pointer { cursor: pointer; }
    .hidden { display: none; }
  </style>
</head>
<body>

  <div class="min-h100 mobile-table center">
    <div class="mobile-table-cell">

      <!-- Shown when playing, 0–12s -->
      <div id="scene-skull" class="anim-fade-in anim-slow hidden">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="512" height="512">
          <path fill="#000" d="M16 7 C13 7 2 9 2 16 C2 23 6 23 10 24 L11 28 L12 26 L20 26 L21 28 L22 24 C26 23 30 23 30 16 C30 9 19 7 16 7 M4 18 A4 4 0 0 1 12 18 A4 4 0 0 1 4 18 M20 18 A4 4 0 0 1 28 18 A4 4 0 0 1 20 18 "/>
        </svg>
      </div>

      <!-- Shown when playing, 12–19.2s -->
      <h1 id="scene-title" class="h0 anim-fade-in anim-slow hidden">Gifolio</h1>

      <!-- Shown when playing, 20.2s+ -->
      <img id="scene-gif" src="gifolio.gif" class="hidden" style="width:100%;" />

      <!-- Shown when NOT playing -->
      <h1 id="scene-prompt" class="f6 fw4 f1-ns fw9-ns">Turn up the volume to 11 &amp; click</h1>

    </div>
  </div>

  <!-- Click overlay to play/pause -->
  <div id="overlay" class="absolute t0 r0 b0 l0 pointer"></div>

  <footer id="footer" class="pam absolute b0 r0 l0">
    <div class="leading-3 tc mid-gray" style='text-transform: uppercase; letter-spacing: 0.15em; font-size: 10px;'>
      <p class="dib" style='font-size: 12px;' >Music by <a href="http://microbeats.cc" title="Music by jxnblk">Jxnblk</a></p>
    </div>
  </footer>

  <script>
    (function () {
      // ── Point this at any hosted mp3 ──
      var AUDIO_SRC = 'https://microbeats.s3.amazonaws.com/american-party.mp3';

      var audio = new Audio(AUDIO_SRC);
      audio.preload = 'auto';

      var playing = false;

      // DOM refs
      var sceneSkull  = document.getElementById('scene-skull');
      var sceneTitle  = document.getElementById('scene-title');
      var sceneGif    = document.getElementById('scene-gif');
      var scenePrompt = document.getElementById('scene-prompt');
      var overlay     = document.getElementById('overlay');
      var footer      = document.getElementById('footer');

      function hideAll() {
        sceneSkull.classList.add('hidden');
        sceneTitle.classList.add('hidden');
        sceneGif.classList.add('hidden');
        scenePrompt.classList.add('hidden');
      }

      function showPrompt() {
        hideAll();
        scenePrompt.classList.remove('hidden');
        footer.classList.remove('hidden');
      }

      function updateScene() {
        if (!playing) return;
        var t = audio.currentTime;
        hideAll();
        footer.classList.add('hidden');

        if (t < 12) {
          sceneSkull.classList.remove('hidden');
        } else if (t < 19.2) {
          sceneTitle.classList.remove('hidden');
        } else if (t >= 20.2) {
          sceneGif.classList.remove('hidden');
        }
      }

      // Play / pause on click
      overlay.addEventListener('click', function () {
        if (!playing) {
          audio.play();
        } else {
          audio.pause();
        }
      });

      audio.addEventListener('play', function () {
        playing = true;
        updateScene();
      });

      audio.addEventListener('pause', function () {
        playing = false;
        showPrompt();
      });

      audio.addEventListener('ended', function () {
        playing = false;
        showPrompt();
      });

      audio.addEventListener('timeupdate', updateScene);

      // Initial state
      showPrompt();
    })();
  </script>

</body>
</html>
